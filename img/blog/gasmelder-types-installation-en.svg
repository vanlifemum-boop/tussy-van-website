<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Gas alarms in campers: which hazard needs which sensor?</title>
  <desc id="desc">Overview of LPG, carbon monoxide and so-called knockout gas, with separate positions for LPG and CO sensors.</desc>
  <rect width="1600" height="1000" rx="42" fill="#e7f0fb"/>
  <rect x="22" y="22" width="1556" height="956" rx="32" fill="none" stroke="#2b2823" stroke-width="8"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#2b2823">
    <rect x="76" y="64" width="360" height="54" rx="27" fill="#2350b5" stroke="#2b2823" stroke-width="5"/>
    <text x="256" y="101" fill="#fff" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="2">CAMPER KNOW-HOW</text>
    <text x="76" y="180" font-size="58" font-weight="800">3 hazards. 2 sensor types.</text>
    <text x="76" y="242" font-size="58" font-weight="800">1 clear rule.</text>
    <rect x="1085" y="70" width="414" height="138" rx="24" fill="#ffff00" stroke="#2b2823" stroke-width="6" transform="rotate(2 1292 139)"/>
    <text x="1292" y="117" font-size="28" font-weight="800" text-anchor="middle">An alarm never replaces</text>
    <text x="1292" y="154" font-size="28" font-weight="800" text-anchor="middle">maintenance or a</text>
    <text x="1292" y="191" font-size="28" font-weight="800" text-anchor="middle">gas-system inspection</text>

    <g transform="translate(76 300)">
      <rect width="454" height="352" rx="28" fill="#fff" stroke="#2b2823" stroke-width="6"/>
      <circle cx="68" cy="70" r="37" fill="#c0704f" stroke="#2b2823" stroke-width="5"/>
      <path d="M68 42v56M49 78l19 20 19-20" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="122" y="64" font-size="36" font-weight="800">Propane / butane</text>
      <text x="122" y="102" font-size="25" fill="#7a746b">liquefied petroleum gas</text>
      <text x="36" y="160" font-size="27" font-weight="700">Risk:</text>
      <text x="36" y="198" font-size="27">leak, fire, explosion</text>
      <text x="36" y="252" font-size="27" font-weight="700">Use:</text>
      <text x="36" y="290" font-size="27">a dedicated LPG sensor</text>
      <rect x="36" y="312" width="276" height="52" rx="20" fill="#ffff00" stroke="#2b2823" stroke-width="4"/>
      <text x="174" y="347" font-size="24" font-weight="800" text-anchor="middle">EN 50194-2</text>
    </g>

    <g transform="translate(573 300)">
      <rect width="454" height="352" rx="28" fill="#fff" stroke="#2b2823" stroke-width="6"/>
      <circle cx="68" cy="70" r="37" fill="#2350b5" stroke="#2b2823" stroke-width="5"/>
      <text x="68" y="80" fill="#fff" font-size="28" font-weight="800" text-anchor="middle">CO</text>
      <text x="122" y="64" font-size="34" font-weight="800">Carbon monoxide</text>
      <text x="122" y="102" font-size="25" fill="#7a746b">invisible and odourless</text>
      <text x="36" y="160" font-size="27" font-weight="700">Risk:</text>
      <text x="36" y="198" font-size="27">poisoning from combustion</text>
      <text x="36" y="252" font-size="27" font-weight="700">Use:</text>
      <text x="36" y="290" font-size="27">a dedicated CO sensor</text>
      <rect x="36" y="312" width="276" height="52" rx="20" fill="#ffff00" stroke="#2b2823" stroke-width="4"/>
      <text x="174" y="347" font-size="24" font-weight="800" text-anchor="middle">EN 50291-2</text>
    </g>

    <g transform="translate(1070 300)">
      <rect width="454" height="352" rx="28" fill="#fff" stroke="#2b2823" stroke-width="6"/>
      <circle cx="68" cy="70" r="37" fill="#ffff00" stroke="#2b2823" stroke-width="5"/>
      <text x="68" y="82" font-size="38" font-weight="800" text-anchor="middle">?</text>
      <text x="122" y="64" font-size="32" font-weight="800">“Knockout gas”</text>
      <text x="122" y="102" font-size="23" fill="#7a746b">not one defined substance</text>
      <text x="36" y="160" font-size="27" font-weight="700">Important:</text>
      <text x="36" y="198" font-size="27">no universal guarantee</text>
      <text x="36" y="252" font-size="27" font-weight="700">Therefore:</text>
      <text x="36" y="290" font-size="27">check every claim</text>
      <rect x="36" y="312" width="345" height="52" rx="20" fill="#d4e4f6" stroke="#2b2823" stroke-width="4"/>
      <text x="208" y="347" font-size="23" font-weight="800" text-anchor="middle">Physical security too</text>
    </g>

    <g transform="translate(76 708)">
      <path d="M48 185h1050l56-48v-84c0-32 26-58 58-58h137c67 0 115 42 129 105l18 85h12v66H48z" fill="#2350b5" stroke="#2b2823" stroke-width="7" stroke-linejoin="round"/>
      <rect x="86" y="59" width="700" height="126" rx="18" fill="#fff" opacity=".96"/>
      <rect x="814" y="59" width="298" height="126" rx="18" fill="#fff" opacity=".96"/>
      <rect x="1194" y="42" width="183" height="95" rx="18" fill="#d4e4f6" stroke="#2b2823" stroke-width="5"/>
      <circle cx="282" cy="230" r="55" fill="#2b2823"/>
      <circle cx="282" cy="230" r="27" fill="#e7f0fb"/>
      <circle cx="1260" cy="230" r="55" fill="#2b2823"/>
      <circle cx="1260" cy="230" r="27" fill="#e7f0fb"/>

      <rect x="138" y="145" width="60" height="40" rx="10" fill="#c0704f" stroke="#2b2823" stroke-width="5"/>
      <path d="M168 137V96" stroke="#2b2823" stroke-width="6" stroke-linecap="round"/>
      <path d="M153 111l15-15 15 15" fill="none" stroke="#2b2823" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="226" y="113" fill="#2b2823" font-size="29" font-weight="800">LPG alarm: low</text>
      <text x="226" y="151" fill="#2b2823" font-size="22">follow the manufacturer</text>

      <rect x="878" y="79" width="60" height="40" rx="10" fill="#ffff00" stroke="#2b2823" stroke-width="5"/>
      <text x="908" y="108" font-size="21" font-weight="800" text-anchor="middle">CO</text>
      <path d="M908 127v42" stroke="#2b2823" stroke-width="6" stroke-linecap="round"/>
      <path d="M893 154l15 15 15-15" fill="none" stroke="#2b2823" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="968" y="94" fill="#2b2823" font-size="29" font-weight="800">CO alarm:</text>
      <text x="968" y="127" fill="#2b2823" font-size="22">sleeping zone</text>
      <text x="968" y="157" fill="#2b2823" font-size="22">follow the manual</text>
    </g>
  </g>
</svg>
