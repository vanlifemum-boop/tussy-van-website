name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update newest blog button
        run: python3 scripts/update_latest_blog.py
      - name: Build statistics page catalog
        run: python3 scripts/build_analytics_catalog.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set custom domain
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"cname":"tussy-van.de"}' || true
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Wait for Pages artifact metadata
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          endpoint = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          for attempt in range(12):
              with urllib.request.urlopen(endpoint, timeout=20) as response:
                  artifacts = json.load(response)['artifacts']
              if any(a['name'] == os.environ['PAGES_ARTIFACT_NAME'] and not a['expired'] for a in artifacts):
                  print('Pages artifact metadata is ready')
                  break
              time.sleep(5)
          else:
              raise SystemExit('Pages artifact metadata did not become available')
          PY
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
